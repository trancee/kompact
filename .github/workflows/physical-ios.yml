name: Physical iPhone build evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, ios-reference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: xcodebuild -version > xcode-version.txt
      - run: system_profiler SPHardwareDataType SPSoftwareDataType > apple-host-metadata.txt
      - run: xcrun devicectl list devices --json-output connected-apple-devices.json
      - run: >-
          ./gradlew :kompact-runtime:compileKotlinIosArm64
          :kompact-benchmarks:compileKotlinIosArm64
          --no-build-cache --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-build-${{ github.sha }}
          path: |
            xcode-version.txt
            apple-host-metadata.txt
            connected-apple-devices.json
            kompact-benchmarks/build/classes/kotlin/iosArm64/**
          if-no-files-found: error
