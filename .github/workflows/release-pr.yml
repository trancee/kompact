name: Release PR

# Manages the "release PR" lifecycle: a long-lived PR from release/ongoing → main
# that accumulates changes from every push to main. Merging the release PR
# triggers release-publish.yml (which bumps the version, builds, deploys to
# Central Portal, tags, and bumps to the next SNAPSHOT).
#
# This workflow does NOT change the version — the release PR stays identical
# to main. Its sole purpose is an approval gate for the release pipeline.
# The branch-sync + PR-create/edit logic lives in:
#   .github/scripts/release/manage-release-pr.sh

on:
  push:
    branches: [main]

# Prevent overlapping runs.
concurrency: release-pr

permissions:
  contents: write
  pull-requests: write

jobs:
  manage-release-pr:
    runs-on: ubuntu-latest
    # Skip commits produced by the release pipeline itself (version bumps).
    # A merged release PR creates a merge commit ("Merge pull request …") or
    # a squash commit ("Release: 0.2.0 (#N)") — neither is filtered, so a
    # new release PR is created after each release.
    if: |
      !startsWith(github.event.head_commit.message, 'release:') &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync or create release branch + PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: .github/scripts/release/manage-release-pr.sh
        # RELEASE_PAT must be a repository-level secret (not just an
        # environment secret) because this workflow runs without `environment:`.
