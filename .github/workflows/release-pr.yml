name: Release PR

# Creates or updates a human-reviewed release PR from release/ongoing → main.
# The branch contains the candidate release version, changelog, and synchronized
# consumer documentation; release-publish.yml only tags the merged commit and
# publishes it. After publication, a separate PR advances the next SNAPSHOT.
# The branch-sync + PR-create/edit logic lives in:
#   .github/scripts/release/manage-release-pr.sh

on:
  push:
    branches: [main]

# Prevent overlapping runs.
concurrency: release-pr

permissions:
  contents: write
  pull-requests: write

jobs:
  manage-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync or create release branch + PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: .github/scripts/release/manage-release-pr.sh
        # RELEASE_PAT must be a repository-level secret (not just an
        # environment secret) because this workflow runs without `environment:`.
