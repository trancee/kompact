name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check --no-build-cache --no-configuration-cache

  clang-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          clang -std=c99 -Wall -Wextra -Wconversion -Wsign-conversion -Werror
          -pedantic-errors -fsanitize=address,undefined
          conformance/c/vehicle_telemetry_test.c -o /tmp/kompact-conformance
      - run: /tmp/kompact-conformance
