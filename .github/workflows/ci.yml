name: CI

# Validates the public ABI goldens and runs the JVM test suite.
# apiCheck enforces both kompact.api (JVM) and kompact.klib.api (merged ios klib).
# ios klib ABI inference only succeeds on Apple hosts, so the klib golden is
# only meaningfully validated on the macOS job — that is its gate.

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  api-check:
    name: apiCheck (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew :kompact:apiCheck --no-daemon

  jvm-test:
    name: jvmTest (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew :kompact:jvmTest --no-daemon
  api-dump:
    name: Regenerate goldens (macOS, feat/* only)
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/heads/feat/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Regenerate ABI goldens (only macOS infers the ios klib ABI). apiCheck
      # immediately after self-verifies the freshly-dumped goldens match source.
      - run: ./gradlew :kompact:apiDump :kompact:apiCheck --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: api-goldens
          path: kompact/api/
          retention-days: 1
