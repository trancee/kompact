name: Apple targets

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          ./gradlew :kompact-runtime:iosSimulatorArm64Test
          :kompact-runtime:compileKotlinIosArm64
          :kompact-annotations:compileKotlinIosArm64
          :kompact-benchmarks:compileKotlinIosArm64
          :kompact-benchmarks:compileKotlinIosSimulatorArm64
          --no-build-cache --no-configuration-cache
