name: Release Publish

# A merged, human-reviewed release PR already contains the release version,
# changelog, and synchronized consumer documentation. This workflow validates
# that exact merge commit, tags it, publishes behind the release environment,
# then proposes the next SNAPSHOT through a separate PR.
#
# pull_request_target uses the trusted workflow definition from main. Code is
# checked out only after merge, so quality gates never execute an unmerged PR
# head with release permissions.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release }}
      next_snapshot: ${{ steps.version.outputs.next_snapshot }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Verify reviewed release metadata
        id: version
        run: |
          CURRENT_VERSION="$(.github/scripts/release/version-bump.sh extract-version)"
          RELEASE_VERSION="$(.github/scripts/release/version-bump.sh extract-release)"
          if [[ "$CURRENT_VERSION" == *-SNAPSHOT || "$CURRENT_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Merged release PR must contain a stable version; found ${CURRENT_VERSION}."
            exit 1
          fi
          bash .github/scripts/release/version-bump-test.sh
          bash .github/scripts/docs/version-docs-check-test.sh
          bash .github/scripts/docs/check-version-references.sh .
          echo "release=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=$(.github/scripts/release/version-bump.sh extract-next-snap)" >> "$GITHUB_OUTPUT"

      - name: Run required Linux gates
        run: |
          ./gradlew \
            spotlessCheck \
            :kompact:checkKotlinAbi \
            :kompact:jvmTest \
            :kompact:koverVerify \
            :kompact:bundleAndroidMainAar \
            :kompact-ksp:checkKotlinAbi \
            :kompact-ksp:test \
            :kompact-ksp:koverVerify \
            :kompact-ksp-integration:test \
            :kompact-gradle-plugin:validatePlugins \
            :kompact-gradle-plugin:checkKotlinAbi \
            :kompact-gradle-plugin:koverVerify \
            --no-daemon --rerun-tasks --no-build-cache --warning-mode all

      # The TestKit suite starts nested multiplatform builds; run it separately
      # from the root build to avoid overlapping compiler daemons.
      - name: Test Gradle plugin KMP consumer
        run: |
          ./gradlew \
            :kompact-gradle-plugin:test \
            --no-daemon --rerun-tasks --no-build-cache --warning-mode all

      - name: Generate ephemeral PGP key
        run: |
          gpg --batch --passphrase "" --pinentry-mode loopback \
            --quick-gen-key "Kompact CI <ci@kompact.dev>" rsa2048 sign 0
          {
            echo "SIGNING_KEY_ID=$(gpg --list-secret-keys --with-colons ci@kompact.dev | awk -F: '/^sec:/ {print substr($5, length($5)-7)}')"
            echo "SIGNING_KEY<<EOF"
            gpg --batch --armor --export-secret-keys ci@kompact.dev
            echo "EOF"
            echo "SIGNING_PASSWORD="
          } >> "$GITHUB_ENV"

      - name: Dry-run all Central Portal bundles
        run: |
          ./gradlew \
            :kompact:generateChecksums :kompact:assembleCentralBundle \
            :kompact-ksp:generateChecksums :kompact-ksp:assembleCentralBundle \
            :kompact-gradle-plugin:generateChecksums :kompact-gradle-plugin:assembleCentralBundle \
            --no-daemon --console=plain
          test -f kompact/build/kompact-portal-bundle.zip
          test -f kompact-ksp/build/kompact-ksp-portal-bundle.zip
          test -f kompact-gradle-plugin/build/kompact-gradle-plugin-portal-bundle.zip

      - name: Create release tag on the reviewed merge commit
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            git fetch origin "refs/tags/v${RELEASE_VERSION}:refs/tags/v${RELEASE_VERSION}"
            TAGGED_SHA="$(git rev-list -n 1 "v${RELEASE_VERSION}")"
            if [[ "$TAGGED_SHA" != "$MERGE_SHA" ]]; then
              echo "::error::v${RELEASE_VERSION} already points to ${TAGGED_SHA}, not ${MERGE_SHA}."
              exit 1
            fi
            echo "Tag v${RELEASE_VERSION} already points to the reviewed merge commit."
          else
            git tag "v${RELEASE_VERSION}" "$MERGE_SHA"
            git push origin "refs/tags/v${RELEASE_VERSION}"
          fi

  deploy:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.prepare.outputs.release_version }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build + sign + assemble bundles
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew \
            :kompact:publishAllPublicationsToBundleDirRepository \
            :kompact:generateChecksums \
            :kompact:assembleCentralBundle \
            :kompact-ksp:publishAllPublicationsToBundleDirRepository \
            :kompact-ksp:generateChecksums \
            :kompact-ksp:assembleCentralBundle \
            :kompact-gradle-plugin:publishAllPublicationsToBundleDirRepository \
            :kompact-gradle-plugin:generateChecksums \
            :kompact-gradle-plugin:assembleCentralBundle \
            --no-daemon --console=plain

      - name: Deploy to Central Portal
        env:
          CENTRAL_PORTAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          CENTRAL_PORTAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
        run: |
          ./gradlew :kompact:centralPortalDeploy \
            :kompact-ksp:centralPortalDeploy \
            :kompact-gradle-plugin:centralPortalDeploy \
            --no-daemon --console=plain

      - name: Wait for validation + check status
        env:
          CENTRAL_PORTAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          CENTRAL_PORTAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
        run: |
          echo "Polling Central Portal for validation status..."
          SUCCESS=0
          for i in $(seq 1 12); do
            echo "  Attempt $i/12..."
            set +e
            ./gradlew :kompact:centralPortalStatus \
              :kompact-ksp:centralPortalStatus \
              :kompact-gradle-plugin:centralPortalStatus \
              --no-daemon --console=plain 2>&1 | tee /tmp/portal-status.txt
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              echo "  Central Portal validation succeeded."
              SUCCESS=1
              break
            fi
            if grep -qiE 'validation failed|FAILED|Could not determine' /tmp/portal-status.txt; then
              echo "  Central Portal validation failed."
              exit 1
            fi
            echo "  Validation is pending; waiting 30 seconds..."
            sleep 30
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "  Central Portal validation did not finish within the polling window."
            exit 1
          fi

      - name: Publish to Central Portal
        env:
          CENTRAL_PORTAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          CENTRAL_PORTAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
        run: |
          ./gradlew :kompact:centralPortalPublish \
            :kompact-ksp:centralPortalPublish \
            :kompact-gradle-plugin:centralPortalPublish \
            --no-daemon --console=plain

  advance-snapshot:
    needs: [prepare, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Open or update next-SNAPSHOT PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          NEXT_SNAPSHOT: ${{ needs.prepare.outputs.next_snapshot }}
        run: |
          CURRENT_VERSION="$(.github/scripts/release/version-bump.sh extract-version)"
          if [[ "$CURRENT_VERSION" == "$NEXT_SNAPSHOT" ]]; then
            echo "Main already contains ${NEXT_SNAPSHOT}; no snapshot PR is needed."
            exit 0
          fi
          if [[ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Expected main at ${RELEASE_VERSION} or ${NEXT_SNAPSHOT}; found ${CURRENT_VERSION}."
            exit 1
          fi

          BRANCH="release/next-snapshot-${NEXT_SNAPSHOT}"
          PR_TITLE="chore(release): advance to ${NEXT_SNAPSHOT}"
          PR_BODY="Advances the development version and maintained consumer documentation after ${RELEASE_VERSION} was published. This PR does not publish artifacts."
          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --template '{{range .}}{{.number}}{{end}}')"

          git fetch origin refs/heads/main:refs/remotes/origin/main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout -B "$BRANCH" "origin/${BRANCH}"
            git reset --hard origin/main
          else
            git checkout -b "$BRANCH" origin/main
          fi

          .github/scripts/release/version-bump.sh bump-next-snap
          python3 .github/scripts/docs/sync-version-references.py .
          bash .github/scripts/docs/check-version-references.sh .
          git add build.gradle.kts README.md SECURITY.md docs
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): advance to ${NEXT_SNAPSHOT}"
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git push origin "$BRANCH" --force-with-lease
          else
            git push --set-upstream origin "$BRANCH"
          fi

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body "$PR_BODY"
            echo "Updated next-SNAPSHOT PR #${PR_NUMBER}"
          else
            gh pr create --head "$BRANCH" --base main --title "$PR_TITLE" --body "$PR_BODY"
            echo "Created next-SNAPSHOT PR"
          fi
