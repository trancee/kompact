[versions]
kotlin = "2.4.21"
ksp = "2.3.12"
kspCoroutines = "1.10.2"
kotlinpoet = "2.4.0"
mutflow = "1.7.0"
agp = "9.4.1"
dokka = "2.2.0"
kover = "0.9.11"
spotless = "8.10.4"
detekt = "1.23.8"
junit = "6.1.3"
benchmark = "0.5.0"
jmh = "1.37"
kotlinxSerialization = "1.12.0"

[plugins]
kmp = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
mutflow = { id = "io.github.anschnapp.mutflow", version.ref = "mutflow" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
agp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlinPowerAssert = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "kotlin" }
benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "benchmark" }

[libraries]
kotlinPowerAssert = { module = "org.jetbrains.kotlin:kotlin-power-assert", version.ref = "kotlin" }
symbolProcessingApi = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinTestJupiter = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junitJupiterApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junitJupiterEngine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
benchmarkRuntime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "benchmark" }
